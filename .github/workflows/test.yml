name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install fonts
        # Several tests exercise real system fonts (Japanese faces, mono
        # families) and skip when they are absent; install them so the
        # tests actually run instead of passing vacuously.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk fonts-dejavu-core fonts-liberation
      - name: Install just
        # Pin the version and download the release asset directly: the
        # just.systems installer resolves "latest" through the GitHub API,
        # whose unauthenticated rate limit (shared runner IPs) made this
        # step fail with 403 before any test ran (run 46163137989).
        env:
          JUST_VERSION: 1.59.0
        run: |
          base="https://github.com/casey/just/releases/download/$JUST_VERSION"
          tarball="just-$JUST_VERSION-x86_64-unknown-linux-musl.tar.gz"
          curl -fsSL --retry 3 -o "/tmp/$tarball" "$base/$tarball"
          curl -fsSL --retry 3 -o /tmp/SHA256SUMS "$base/SHA256SUMS"
          expected=$(awk -v f="$tarball" '$2 == f { print $1 }' /tmp/SHA256SUMS)
          actual=$(sha256sum "/tmp/$tarball" | awk '{ print $1 }')
          [ -n "$expected" ] && [ "$expected" = "$actual" ]
          mkdir -p "$HOME/.local/bin"
          tar -xzf "/tmp/$tarball" -C "$HOME/.local/bin" just
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: just test
        run: just test

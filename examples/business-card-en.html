<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Business Card (Umikaze Design)</title>
<style>
  body { margin: 0; padding: 18px; font-family: "DejaVu Sans", sans-serif; color: #222222; }
  .company { font-family: "DejaVu Serif", serif; font-size: 10pt; color: #1f5f7a; margin: 0; border-bottom: 2px solid #1f5f7a; padding-bottom: 3px; }
  .role { font-size: 6.5pt; color: #666666; margin: 10px 0 0 0; }
  .name { font-family: "DejaVu Serif", serif; font-size: 16pt; margin: 1px 0 0 0; }
  .roman { font-size: 6.5pt; color: #666666; margin: 0 0 8px 0; }
  .info { font-size: 6.5pt; line-height: 1.5; margin: 0; }
  .back { background-color: #1f5f7a; color: #ffffff; text-align: center; padding-top: 34px; padding-bottom: 34px; }
  .back .logo { font-family: "DejaVu Serif", serif; font-size: 18pt; margin: 0; }
  .back .tag { font-size: 6.5pt; margin: 6px 0 0 0; }
</style>
</head>
<body>
<p class="company">Umikaze Design</p>
<p class="role">Founder / Designer</p>
<p class="name">Taro Yamada</p>
<p class="roman">山田 太郎</p>
<p class="info">0-0-0 Minatomirai, Nishi-ku, Yokohama 220-0000, Japan<br>
Tel +81 90-0000-0000<br>
Mail taro@example.com</p>
<page-break></page-break>
<div class="back">
  <p class="logo">Umikaze Design</p>
  <p class="tag">Sea-breeze design studio, Yokohama</p>
</div>
</body>
</html>

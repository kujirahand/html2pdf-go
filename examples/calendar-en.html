<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>December 2026 Calendar</title>
<style>
  body { margin: 0; padding: 40px 36px; font-family: "DejaVu Sans", sans-serif; color: #222222; }
  h1 { font-family: "DejaVu Serif", serif; font-size: 32pt; text-align: center; color: #8a1f2b; margin: 0 0 4px 0; }
  .sub { text-align: center; font-size: 11pt; color: #666666; margin: 0 0 20px 0; }
  table.cal { width: 100%; border-collapse: collapse; }
  table.cal th { background-color: #8a1f2b; color: #ffffff; border: 1px solid #555555; padding: 8px 0; font-size: 12pt; }
  table.cal td { border: 1px solid #555555; height: 86px; vertical-align: top; padding: 6px 8px; width: 14%; font-size: 14pt; }
  .sun { color: #cc2222; }
  .sat { color: #2255cc; }
  .note { font-size: 8pt; color: #333333; }
  .legend { font-size: 9.5pt; color: #555555; margin-top: 14px; }
</style>
</head>
<body>
<h1>December 2026</h1>
<p class="sub">Sunday-start monthly calendar</p>
<table class="cal">
  <tr>
    <th class="sun">Sun</th><th>Mon</th><th>Tue</th><th>Wed</th><th>Thu</th><th>Fri</th><th class="sat">Sat</th>
  </tr>
  <tr>
    <td></td><td></td>
    <td>1</td><td>2</td><td>3</td><td>4</td><td class="sat">5</td>
  </tr>
  <tr>
    <td class="sun">6</td><td>7</td><td>8</td><td>9</td><td>10</td><td>11</td><td class="sat">12</td>
  </tr>
  <tr>
    <td class="sun">13</td><td>14</td><td>15</td><td>16</td><td>17</td><td>18</td>
    <td class="sat">19<br><span class="note">Sakuramml Live</span></td>
  </tr>
  <tr>
    <td class="sun">20</td><td>21</td><td>22</td><td>23</td><td>24</td>
    <td>25<br><span class="note">Christmas</span></td>
    <td class="sat">26</td>
  </tr>
  <tr>
    <td class="sun">27</td><td>28</td><td>29</td><td>30</td>
    <td>31<br><span class="note">New Year's Eve</span></td>
    <td></td><td></td>
  </tr>
</table>
<p class="legend">Red: Sundays / Blue: Saturdays</p>
</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>2026年12月カレンダー</title>
<style>

  .sat { color: #2255cc; }
  .note { font-size: 8.5pt; color: #333333; }
  .legend { font-size: 10pt; color: #555555; margin-top: 14px; }
</style>
</head>
<body>

</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>コンサートチケット</title>
<style>
  body { margin: 0; padding: 40px 36px; font-family: "IPAexGothic", sans-serif; color: #222222; }
  table.ticket { width: 100%; border-collapse: collapse; border: 3px solid #1a3a5c; }
  td.main { width: 70%; padding: 22px 26px; vertical-align: top; background-color: #f4f7fb; }
  td.stub { width: 30%; padding: 22px 18px; vertical-align: top; border-left: 2px dashed #1a3a5c; background-color: #ffffff; }
  .label { font-size: 9pt; color: #1a3a5c; margin: 12px 0 2px 0; }
  .title { font-family: "IPAexMincho", serif; font-size: 26pt; color: #1a3a5c; margin: 4px 0 4px 0; }
  .sub { font-size: 11pt; color: #555555; margin: 0; }
  .value { font-size: 14pt; margin: 0; }
  .seat { font-size: 18pt; font-weight: bold; margin: 0; }
  .price { font-size: 16pt; margin: 0; }
  .tag { background-color: #1a3a5c; color: #ffffff; padding: 3px 10px; font-size: 10pt; }
  .warn { font-size: 9pt; color: #aa2222; margin-top: 16px; border: 1px solid #aa2222; padding: 4px 8px; }
  .stub .title2 { font-family: "IPAexMincho", serif; font-size: 13pt; color: #1a3a5c; margin: 0 0 8px 0; }
  .stub p { margin: 0; }
  .small { font-size: 9pt; color: #555555; margin-top: 14px; line-height: 1.5; }
</style>
</head>
<body>
<table class="ticket">
  <tr>
    <td class="main">
      <p><span class="tag">入場券 ADMISSION</span></p>
      <p class="title">Sakuramml Live 2026</p>
      <p class="sub">横浜みなとホール</p>
      <p class="label">日時</p>
      <p class="value">2026年12月19日（土）　開場 17:30 ／ 開演 18:00</p>
      <p class="label">座席</p>
      <p class="seat">1階　12列　8番</p>
      <p class="label">料金</p>
      <p class="price">3,500円（税込）</p>
      <p class="warn">※ 再入場はできません。チケットの再発行・転売は固くお断りします。</p>
    </td>
    <td class="stub">
      <p class="title2">Sakuramml Live 2026</p>
      <p class="label">日付</p>
      <p class="value">12/19（土）</p>
      <p class="label">開演</p>
      <p class="value">18:00</p>
      <p class="label">座席</p>
      <p class="value">1F 12列 8番</p>
      <p class="small">半券は終演までお持ちください。<br>再入場不可</p>
    </td>
  </tr>
</table>
<p style="font-size:9pt; color:#777777; margin-top:14px;">※ このチケットは架空のものです。 No. 0001-2026</p>
</body>
</html>
